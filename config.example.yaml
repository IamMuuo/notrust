# NOTRUST daemon configuration
#
# Copy this file to one of:
#   ./config.yaml
#   ~/.config/notrust/config.yaml
#   /etc/notrust/config.yaml
#
# Every key below can also be set as an environment variable, prefixed
# with NOTRUST_. Example: poll_interval becomes NOTRUST_POLL_INTERVAL.
# Environment variables always win over whatever is set here.

# How often the daemon samples container metrics to evaluate idle state.
# Accepts Go duration strings: "500ms", "3s", "1m".
poll_interval: 1s


# How often a summary line ("N tracked, N active, N paused, N stopped")
# is logged at INFO level, so a human tailing journalctl can confirm
# the daemon is alive without wading through poll-tick DEBUG noise.
heartbeat_interval: 5m

# idle configuration
idle:
  pause_after: 10m
  stop_after: 30m
  cpu_threshold_percent: 0.5
  net_threshold_bytes: 1024

